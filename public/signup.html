<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroParks — Sign Up</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="logo">AstroParks</div>
      <div class="subtitle">Create Your Account</div>
    </div>

    <form id="signupForm">
      <div>
        <label for="email">Email Address</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          placeholder="parker@example.com"
          autocomplete="email"
        />
      </div>

      <div>
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          placeholder="At least 8 characters"
          autocomplete="new-password"
        />
      </div>

      <div>
        <label for="confirm_password">Confirm Password</label>
        <input
          id="confirm_password"
          name="confirm_password"
          type="password"
          required
          placeholder="Re-enter your password"
          autocomplete="new-password"
        />
      </div>

      <div>
        <label for="license_plate">Vehicle License Plate</label>
        <input
          id="license_plate"
          name="license_plate"
          type="text"
          required
          placeholder="ABC 123"
          autocomplete="off"
        />
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Create Account</button>
      <p class="error-msg" id="errorMsg"></p>
    </form>

    <p class="auth-link">Already have an account? <a href="/login.html">Sign in</a></p>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm_password').value;

      if (password !== confirm) {
        errorMsg.textContent = 'Passwords do not match.';
        return;
      }
      if (password.length < 8) {
        errorMsg.textContent = 'Password must be at least 8 characters.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';

      const payload = {
        email: document.getElementById('email').value.trim(),
        password,
        license_plate: document.getElementById('license_plate').value.trim(),
      };

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.status === 201) {
          window.location.href = '/login.html';
          return;
        }

        const data = await res.json();
        errorMsg.textContent = data.error || 'Something went wrong. Please try again.';
      } catch {
        errorMsg.textContent = 'Network error. Please check your connection.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
