const stateOrder = ['', 'green', 'yellow', 'red'];
const spaceState = {};

const svg = document.getElementById('overlaySvg');
const polygons = {};

function buildMap() {
  for (const [id, pts] of Object.entries(spaces)) {
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
    poly.dataset.id = id;
    poly.addEventListener('click', () => cycleSpace(id));
    svg.appendChild(poly);
    polygons[id] = poly;
    spaceState[id] = '';
  }
}

function cycleSpace(id) {
  const cur = spaceState[id] || '';
  const next = stateOrder[(stateOrder.indexOf(cur) + 1) % stateOrder.length];
  setSpaceState(id, next, true);
}

function setSpaceState(id, status, persist) {
  spaceState[id] = status;
  polygons[id].className.baseVal = status ? 'space-' + status : '';
  updateStats();
  if (persist) {
    fetch('/api/spaces/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    }).catch(console.error);
  }
}

function updateStats() {
  const counts = { green: 0, yellow: 0, red: 0, empty: 0 };
  for (const s of Object.values(spaceState)) {
    if (s === 'green') counts.green++;
    else if (s === 'yellow') counts.yellow++;
    else if (s === 'red') counts.red++;
    else counts.empty++;
  }
  document.getElementById('cnt-green').textContent = counts.green;
  document.getElementById('cnt-yellow').textContent = counts.yellow;
  document.getElementById('cnt-red').textContent = counts.red;
  document.getElementById('cnt-empty').textContent = counts.empty;
}

async function loadSpaces() {
  try {
    const res = await fetch('/api/spaces');
    if (!res.ok) return;
    const rows = await res.json();
    for (const { space_id, status } of rows) {
      if (spaces[space_id] !== undefined) {
        setSpaceState(space_id, status || '', false);
      }
    }
  } catch (e) { console.error('Load spaces failed', e); }
}

// ─── Rules Panel ───────────────────────────────────────────────────────────────

async function loadRules() {
  const list = document.getElementById('rulesList');
  try {
    const res = await fetch('/api/rules');
    const rules = await res.json();
    if (!rules.length) {
      list.innerHTML = '<p class="loading">No rules configured yet.</p>';
      return;
    }
    list.innerHTML = rules.map(r => renderRule(r)).join('');
  } catch (e) {
    list.innerHTML = '<p class="loading">Failed to load rules.</p>';
  }
}

function renderRule(r) {
  const rate = (r.rate_cents / 100).toFixed(2);
  const start = r.enforce_start ? r.enforce_start.slice(0,5) : '';
  const end   = r.enforce_end   ? r.enforce_end.slice(0,5)   : '';
  const time  = start && end ? `${start} – ${end}` : 'Any time';
  return `
    <div class="rule-card" id="rule-${r.id}">
      <div class="rule-view">
        <div class="rule-info">
          <span class="rule-badge">$${rate}/hr</span>
          <span class="rule-badge rule-badge-alt">${r.max_hours} hr max</span>
          <span class="rule-time">&#x23F0; ${time}</span>
          ${r.note ? `<span class="rule-note">${r.note}</span>` : ''}
        </div>
        <div class="rule-actions">
          <button class="btn-icon" title="Edit" onclick="startEditRule(${r.id})">&#9998;</button>
          <button class="btn-icon btn-icon-del" title="Delete" onclick="deleteRule(${r.id})">&#x2715;</button>
        </div>
      </div>
      <div class="rule-edit" style="display:none">
        <div class="form-row">
          <div class="field"><label>Rate ($/hr)</label>
            <input type="number" id="edit-rate-${r.id}" value="${rate}" min="0" step="0.01">
          </div>
          <div class="field"><label>Max Hours</label>
            <input type="number" id="edit-maxhours-${r.id}" value="${r.max_hours}" min="1" step="1">
          </div>
        </div>
        <div class="form-row">
          <div class="field"><label>Enforce From</label>
            <input type="time" id="edit-start-${r.id}" value="${start}">
          </div>
          <div class="field"><label>Enforce Until</label>
            <input type="time" id="edit-end-${r.id}" value="${end}">
          </div>
        </div>
        <div class="field"><label>Note</label>
          <input type="text" id="edit-note-${r.id}" value="${r.note || ''}">
        </div>
        <div class="rule-edit-actions">
          <button class="btn-primary btn-sm" onclick="saveRule(${r.id})">Save</button>
          <button class="btn-secondary btn-sm" onclick="cancelEditRule(${r.id})">Cancel</button>
        </div>
      </div>
    </div>`;
}

function startEditRule(id) {
  document.querySelector(`#rule-${id} .rule-view`).style.display = 'none';
  document.querySelector(`#rule-${id} .rule-edit`).style.display = 'block';
}

function cancelEditRule(id) {
  document.querySelector(`#rule-${id} .rule-view`).style.display = '';
  document.querySelector(`#rule-${id} .rule-edit`).style.display = 'none';
}

async function saveRule(id) {
  const rate_cents = Math.round(parseFloat(document.getElementById(`edit-rate-${id}`).value) * 100);
  const max_hours  = parseInt(document.getElementById(`edit-maxhours-${id}`).value, 10);
  const enforce_start = document.getElementById(`edit-start-${id}`).value || null;
  const enforce_end   = document.getElementById(`edit-end-${id}`).value   || null;
  const note          = document.getElementById(`edit-note-${id}`).value   || null;
  try {
    const res = await fetch(`/api/rules/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rate_cents, max_hours, enforce_start, enforce_end, note })
    });
    if (!res.ok) throw new Error('Save failed');
    loadRules();
    showMsg('rules-msg', 'Rule saved.', 'success');
  } catch (e) { showMsg('rules-msg', 'Save failed.', 'error'); }
}

async function deleteRule(id) {
  if (!confirm('Delete this rule?')) return;
  try {
    await fetch(`/api/rules/${id}`, { method: 'DELETE' });
    loadRules();
  } catch (e) { console.error(e); }
}

async function addRule() {
  const rate_cents = Math.round(parseFloat(document.getElementById('new-rate').value) * 100);
  const max_hours  = parseInt(document.getElementById('new-maxhours').value, 10);
  const enforce_start = document.getElementById('new-start').value || null;
  const enforce_end   = document.getElementById('new-end').value   || null;
  const note          = document.getElementById('new-note').value   || null;
  if (!rate_cents || !max_hours) { showMsg('rules-msg', 'Rate and max hours are required.', 'error'); return; }
  try {
    const res = await fetch('/api/rules', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rate_cents, max_hours, enforce_start, enforce_end, note })
    });
    if (!res.ok) throw new Error();
    ['new-rate','new-maxhours','new-start','new-end','new-note'].forEach(id => document.getElementById(id).value = '');
    loadRules();
    showMsg('rules-msg', 'Rule added.', 'success');
  } catch (e) { showMsg('rules-msg', 'Failed to add rule.', 'error'); }
}

// ─── Newsfeed ──────────────────────────────────────────────────────────────────

const sampleEvents = [
  { plate: 'ABC123', type: 'entered',    color: 'blue',  vehicle: 'sedan',   compliance: 'compliant' },
  { plate: 'XYZ789', type: 'entered',    color: 'silver', vehicle: 'SUV',    compliance: 'unregistered' },
  { plate: 'GHI456', type: 'entered',    color: 'red',   vehicle: 'pickup',  compliance: 'compliant' },
  { plate: 'JKL321', type: 'violation',  color: 'white', vehicle: 'coupe',   compliance: 'violation' },
  { plate: 'MNO654', type: 'entered',    color: 'black', vehicle: 'van',     compliance: 'unregistered' },
  { plate: 'GHI456', type: 'exited',     color: 'red',   vehicle: 'pickup',  compliance: 'exited' },
];

const simPlates  = ['TUV111','WXY222','ZAB333','CDE444','FGH555','IJK666'];
const simColors  = ['white','black','grey','blue','silver','green','red'];
const simVehicles= ['sedan','SUV','pickup truck','coupe','hatchback','van'];
const simTypes   = ['entered','exited','violation'];
const simCompMap = { entered: ['compliant','unregistered'], exited: ['exited'], violation: ['violation'] };

function fmtTime(d) {
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function eventCard(evt, timeStr) {
  const descriptions = {
    entered:   `A ${evt.color} ${evt.vehicle} with license plate <strong>${evt.plate}</strong> has entered the parking lot.`,
    exited:    `The ${evt.color} ${evt.vehicle} with license plate <strong>${evt.plate}</strong> has exited the parking lot.`,
    violation: `<strong>${evt.plate}</strong> — Parking violation detected on the ${evt.color} ${evt.vehicle}.`,
  };
  const badges = {
    compliant:    '<span class="badge badge-green">&#10003; Compliant — Permitted</span>',
    unregistered: '<span class="badge badge-yellow">&#x26A0; Unregistered — Flagged</span>',
    violation:    '<span class="badge badge-red">&#x2715; Violation</span>',
    exited:       '<span class="badge badge-grey">&#8594; Exited</span>',
  };
  return `
    <div class="event-card event-${evt.compliance}">
      <div class="event-meta">
        <span class="event-plate">${evt.plate}</span>
        <span class="event-time">${timeStr}</span>
      </div>
      <p class="event-desc">${descriptions[evt.type] || descriptions.entered}</p>
      ${badges[evt.compliance] || ''}
    </div>`;
}

function seedFeed() {
  const feed = document.getElementById('eventFeed');
  const now = new Date();
  const cards = sampleEvents.map((evt, i) => {
    const t = new Date(now - (sampleEvents.length - i) * 4 * 60000);
    return eventCard(evt, fmtTime(t));
  });
  feed.innerHTML = cards.reverse().join('');
}

function simulateEvent() {
  const plate   = simPlates[Math.floor(Math.random() * simPlates.length)];
  const color   = simColors[Math.floor(Math.random() * simColors.length)];
  const vehicle = simVehicles[Math.floor(Math.random() * simVehicles.length)];
  const type    = simTypes[Math.floor(Math.random() * simTypes.length)];
  const compliances = simCompMap[type];
  const compliance  = compliances[Math.floor(Math.random() * compliances.length)];
  const card = eventCard({ plate, color, vehicle, type, compliance }, fmtTime(new Date()));
  const feed = document.getElementById('eventFeed');
  feed.insertAdjacentHTML('afterbegin', card);
}

// ─── Helpers ───────────────────────────────────────────────────────────────────

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'panel-msg panel-msg-' + type;
  setTimeout(() => { el.textContent = ''; el.className = 'panel-msg'; }, 3000);
}

// ─── Init ──────────────────────────────────────────────────────────────────────

buildMap();
loadSpaces();
loadRules();
seedFeed();
</script>
</body>
</html>
