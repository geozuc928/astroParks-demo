<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroParks — Sign In</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="logo">AstroParks</div>
      <div class="subtitle">Sign In to Your Account</div>
    </div>

    <form id="loginForm">
      <div>
        <label for="email">Email Address</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          placeholder="parker@example.com"
          autocomplete="email"
        />
      </div>

      <div>
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          placeholder="Your password"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
      <p class="error-msg" id="errorMsg"></p>
    </form>

    <p class="auth-link">Don't have an account? <a href="/signup.html">Sign up</a></p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const payload = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          window.location.href = '/rules.html';
          return;
        }

        const data = await res.json();
        errorMsg.textContent = data.error || 'Sign in failed. Please try again.';
      } catch {
        errorMsg.textContent = 'Network error. Please check your connection.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
